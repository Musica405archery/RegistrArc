<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">RegistrArc</title>
  <desc id="d">Le module de greffe pour I@nseo</desc>
  <rect width="1200" height="280" rx="18" fill="#14336b"/>
  <!-- Fines lignes de cibles en fond, à droite -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
    <circle cx="1080" cy="140" r="60"/>
    <circle cx="1080" cy="140" r="110"/>
    <circle cx="1080" cy="140" r="160"/>
    <circle cx="1080" cy="140" r="210"/>
  </g>
  <!-- Blason : 5 zones de couleur, de l'extérieur vers le centre -->
  <g transform="translate(160 140)">
    <circle r="100" fill="#ffffff"/>
    <circle r="80" fill="#1a1a1a"/>
    <circle r="60" fill="#00a2e8"/>
    <circle r="40" fill="#e3242b"/>
    <circle r="20" fill="#ffd200"/>
    <g fill="none" stroke-width="1.2">
      <circle r="90" stroke="#1a1a1a" stroke-opacity="0.35"/>
      <circle r="70" stroke="#ffffff" stroke-opacity="0.45"/>
      <circle r="50" stroke="#1a1a1a" stroke-opacity="0.35"/>
      <circle r="30" stroke="#1a1a1a" stroke-opacity="0.35"/>
      <circle r="10" stroke="#1a1a1a" stroke-opacity="0.45"/>
    </g>
    <!-- Flèche plantée dans le 10 -->
    <g transform="rotate(-35)">
      <line x1="4" y1="0" x2="162" y2="0" stroke="#f4f1e8" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Empennes (plumes) et encoche au bout de la flèche -->
      <path d="M124 -2 L156 -2 L164 -17 L138 -17 Z" fill="#ffd200"/>
      <path d="M124 2 L156 2 L164 17 L138 17 Z" fill="#ffd200"/>
      <rect x="160" y="-3.5" width="8" height="7" rx="2" fill="#e3242b"/>
    </g>
    <circle r="4" fill="#1a1a1a"/>
  </g>
  <text x="330" y="132" fill="#ffffff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="1">RegistrArc</text>
  <text x="333" y="182" fill="#c9d5ec" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28">Le module de greffe pour I@nseo</text>
  <text x="333" y="222" fill="#8fa6cf" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20">Inscriptions · Encaissement · Factures · Remise de chèques</text>
</svg>
